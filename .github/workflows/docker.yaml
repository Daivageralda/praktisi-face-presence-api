name: Build, Push, Deploy to VPS 

on:
  push:
    branches:
      - beta-v1

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/face-presence-api-beta:latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

    - name: Build and Push Image
      run: |
        docker build -t $IMAGE_NAME .
        docker push $IMAGE_NAME

    - name: SSH Setup 
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        log-public-key: true

    - name: SSH to VPS and Deploy
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/face-presence-api-beta:latest

          sudo docker stop face-presence-api || true
          sudo docker rm face-presence-api || true

          sleep 2

          sudo docker run -d \
            --name face-presence-api \
            -p 8888:8888 \
            --env-file /home/daivageralda831/.env \
            -v /home/daivageralda831/src/etc/secret:/app/src/etc/secret:ro \
            --restart unless-stopped \
            ${{ secrets.DOCKERHUB_USERNAME }}/face-presence-api-beta:latest

          echo "✅ Deployment success on VPS"
        EOF